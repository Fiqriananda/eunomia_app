name: eunomia
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.3
  flutter_svg: ^2.3.0
  get: ^4.7.3
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21
